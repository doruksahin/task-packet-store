name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: release check (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install rclone
        run: |
          version=v1.75.0
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLO "https://downloads.rclone.org/$version/rclone-$version-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/$version/SHA256SUMS"
          grep "rclone-$version-linux-amd64.zip" SHA256SUMS | sha256sum --check
          unzip -q "rclone-$version-linux-amd64.zip"
          install -m 0755 "rclone-$version-linux-amd64/rclone" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run the release gate
        run: pnpm release:check
