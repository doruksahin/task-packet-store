name: Install rclone
description: Download the pinned rclone release for linux-amd64, verify its checksum, and put it on PATH.

inputs:
  version:
    description: rclone release tag to install, for example v1.75.0
    required: false
    default: v1.75.0

runs:
  using: composite
  steps:
    - name: Download, verify, and install rclone
      shell: bash
      env:
        PACKET_STORE_RCLONE_RELEASE: ${{ inputs.version }}
      run: |
        set -euo pipefail
        version="$PACKET_STORE_RCLONE_RELEASE"
        cd "$RUNNER_TEMP"
        mkdir -p "$RUNNER_TEMP/bin"
        curl -fsSLO "https://downloads.rclone.org/$version/rclone-$version-linux-amd64.zip"
        curl -fsSLO "https://downloads.rclone.org/$version/SHA256SUMS"
        grep "rclone-$version-linux-amd64.zip" SHA256SUMS | sha256sum --check
        unzip -q "rclone-$version-linux-amd64.zip"
        install -m 0755 "rclone-$version-linux-amd64/rclone" "$RUNNER_TEMP/bin/rclone"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/bin/rclone" version
